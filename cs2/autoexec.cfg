// Network Settings
rate "1000000"

//Audio
volume "0.4"
snd_mixahead "0.05"
snd_headphone_pan_exponent "2"
snd_headphone_pan_radial_weight "2"
snd_mute_losefocus "1"
snd_musicvolume "1.0"
snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundend_volume "0"
snd_mapobjective_volume "0"
snd_tensecondwarning_volume "0.15"
snd_deathcamera_volume "0.1"
snd_mvp_volume ".1"

//Video
r_fullscreen_gamma "2.2"
fps_max "999"
r_drawtracers_firstperson "1"
r_show_build_info "0"

//Mouse
sensitivity ".5"
zoom_sensitivity_ratio "1"

//Misc
developer "0"
// .022 for 16:9, .0165 for 4:3
m_yaw .0165

option_duck_method "0"
option_speed_method "0"
cl_teammate_colors_show "1"
cl_use_opens_buy_menu "0"
cl_crosshair_sniper_width "1"
cl_player_ping_mute "0"
cl_sniper_auto_rezoom "1"
cl_teamcounter_playercount_instead_of_avatars "0"

//HUD
cl_hud_color "5"
cl_hud_radar_scale "1.200000"
hud_scaling "1.000"
hud_showtargetid 0 // friendly fire reticle
safezonex "0.900000"
safezoney "0.980000"
cl_radar_scale_alternate 0.45
bind capslock toggleradarscale

//Viewmodel
// my custom viewmodel
viewmodel_presetpos 1
viewmodel_offset_x 2.5
viewmodel_offset_y 2
viewmodel_offset_z -1.5
viewmodel_fov 68
cl_prefer_lefthanded 1

alias viewmodel1 "exec viewmodel1"
alias viewmodel2 "exec viewmodel2"
alias viewmodel3 "exec viewmodel3"

alias toggle_viewmodel view2 //if view1 = default
alias view1 "viewmodel1; alias toggle_viewmodel view2"
alias view2 "viewmodel2; alias toggle_viewmodel view3"
alias view3 "viewmodel3; alias toggle_viewmodel view1"
bind 7 toggle_viewmodel

//Radar
cl_radar_always_centered "1"
cl_radar_square_with_scoreboard "1"
cl_radar_rotate "1"
cl_radar_scale "0.9"
cl_radar_icon_scale_min "0.4"

//Help Messages - you dont need these
gameinstructor_enable "0"
cl_autohelp "0"

//Max Ping - adjust for preference
mm_dedicated_search_maxping "80" 




// ============== KEYBINDS ============== //

// 
bind m "toggle sensitivity .5 1"

// UTLITY

bind "g" "drop"
bind "alt" "+reload"
bind "mwheelup" "invprev"
bind "n" "buymenu"
bind "h" "+spray_menu"
bind "r" "buy smokegrenade; slot8" // use smoke
bind "4" "buy flashbang; slot7" // use flash
bind "c" "buy molotov; buy incgrenade; slot10" // use moly
bind "z" "buy hegrenade; slot6" // use he grenade

// Drop bomb - drops bomb with one click (credit to @YourAntiCheat)
// Drops bomb and switches to primary
alias +bodr "slot5"
alias -bodr "slot5; drop"
bind "x" +bodr


// MOVEMENT

bind ctrl +duck
bind b +duck
bind shift +sprint
 
//bind "w" "+forward"
//bind "a" "+left" 
//bind "S" "+back" 
//bind "d" "+right"
bind space +jump
bind mwheeldown +jump



// Buy Binds

bind "leftarrow" "buy vest;"
bind "downarrow" "buy ak47; buy m4a1; buy vesthelm; buy defuser; buy smokegrenade; buy flashbang; buy incgrenade; buy hegrenade;"
bind "rightarrow" "buy awp; buy vesthelm; buy defuser; buy smokegrenade; buy flashbang; buy molotov; buy hegrenade; buy p250;"
bind "uparrow" "buy deagle; buy revolver; buy vesthelm; buy vest;"

bind "kp_0" "buy vesthelm"
bind "kp_1" "buy ak47; buy m4a1"
bind "kp_2" "buy m4a1_silencer"
bind "kp_3" "buy awp"
bind "kp_4" "buy mac10; buy mp9"
bind "kp_5" "buy deagle"
bind "kp_6" "buy p250"
bind "kp_7" "buy famas; buy galilar"
bind "kp_8" "buy ssg08"
bind "kp_del" "buy defuser"


// COMMUNICATION

bind "mouse5" "+voicerecord"
bind "mouse3" "player_ping"
bind "y" "messagemode"
bind "u" "messagemode2"
bind o "say afk"
bind p "say ♿"
bind del "disconnect"
bind end "quit"
bind "k" "radio1"
bind "j" "radio2"

bind "l" "say ( ☞ ͡° ͜ʖ ͡° ) ☞ ｄｏｎｔ　ｔａｌｋｉｎｇ　ｐｌｅａｓｅ ( ☞ ͡° ͜ʖ ͡° ) ☞"	

// PRACTICE 

bind "kp_9" "bot_stop 1; bot_place"
bind SEMICOLON "sv_rethrow_last_grenade"
bind q "noclip"

// =========== END KEYBINDS =========== //

// CROSSHAIR
exec crosshair1

// nade crosshair
bind 5 nadetoggleon
alias "nadetoggleon" "cl_crosshair_length 255; bind 5 nadetoggleoff" // 255 = game max
alias "nadetoggleoff" "cl_crosshair_length 7; bind 5 nadetoggleon" // 7 = crosshair1 length; keeps current outline/color

// Toggle crosshair color
alias crosshaircolor aview2 //if view1 = default
alias aview1 "cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; alias crosshaircolor aview2" // red (crosshair1)
alias aview2 "cl_crosshaircolor_r 50; cl_crosshaircolor_g 250; cl_crosshaircolor_b 50; alias crosshaircolor aview3" // green
alias aview3 "cl_crosshaircolor_r 50; cl_crosshaircolor_g 250; cl_crosshaircolor_b 250; alias crosshaircolor aview4" // cyan
alias aview4 "cl_crosshaircolor_r 250; cl_crosshaircolor_g 250; cl_crosshaircolor_b 50; alias crosshaircolor aview1" // yellow
bind 0 crosshaircolor 

// Toggle serious crosshairs
alias crosshairs bview2 //if view1 = default
alias bview1 "exec crosshair1; alias crosshairs bview2"
alias bview2 "exec crosshair2; alias crosshairs bview1"
bind 8 crosshairs 

// Toggle dumb crosshairs
alias crosshairsbad cview1
alias cview1 "exec crosshair3; echo crosshair3; alias crosshairsbad cview2"
alias cview2 "exec crosshair4; echo crosshair4; alias crosshairsbad cview3"
alias cview3 "exec crosshair5; echo crosshair5; alias crosshairsbad cview4"
alias cview4 "exec crosshair6; echo crosshair6; alias crosshairsbad cview5"
alias cview5 "exec crosshair7; echo crosshair7; alias crosshairsbad cview6"
alias cview6 "exec crosshair8; echo crosshair8; alias crosshairsbad cview7"
alias cview7 "exec crosshair9; echo crosshair9; alias crosshairsbad cview8"
alias cview8 "exec crosshair10; echo crosshair10; alias crosshairsbad cview9"
alias cview9 "exec crosshair11; echo crosshair11; alias crosshairsbad cview1"
bind 9 crosshairsbad 


