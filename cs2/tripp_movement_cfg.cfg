bind mouse4 +ljright
bind d +d
bind w +w

alias +d "rightleft 1 0 0"
alias -d "rightleft 0 0 0"

// ljright
alias reset "bind mouse_x yaw"
alias minusforward2 "-w; bind mouse_x "plusright""
alias plusright "+d; reset"

alias +ljright "+duck; bind mouse_x ljr1"
alias -ljright "-duck; bind mouse_x ljr2"

alias ljr1 "+jump; "bind mouse_x minusforward2"
alias ljr2 "-jump; "bind mouse_x"; reset

// ljleft (mirror of ljright)
alias minusforward2l "-w; bind mouse_x "plusleft""
alias plusleft "+a; reset"

alias +ljleft "+duck; bind mouse_x ljl1"
alias -ljleft "-duck; bind mouse_x ljl2"

alias ljl1 "+jump; "bind mouse_x minusforward2l"
alias ljl2 "-jump; "bind mouse_x"; reset


setinfo jump 0; toggle jump "-999 0 0"
reset

//
alias jbn "-duck; bind mouse_x jb1"
alias jb1 "+jump; bind mouse_x jb2"
alias jb2 "-jump; revert"
alias revert "bind mouse_x yaw"
    
bind v jbn

// T swaps hands and longjump direction (left hand = left lj on mouse4)
alias hand_left "switchhandsleft; bind mouse4 +ljleft; alias hand_toggle hand_right"
alias hand_right "switchhandsright; bind mouse4 +ljright; alias hand_toggle hand_left"
bind t hand_toggle
hand_left
